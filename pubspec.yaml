name: superhero_squad
description: "App de Super-Heróis - Trabalho 1 UFRN 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  provider: ^6.1.2

  # Immutable models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Network
  http: ^1.2.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.0

  # Images
  cached_network_image: ^3.4.1

  # Pagination
  infinite_scroll_pagination: ^4.1.0

  # Progress bars for powerstats
  primer_progress_bar: ^0.2.0

  # Dialogs
  awesome_dialog: ^3.2.1

  # Preferences (daily contract)
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.15.2
  freezed: ^4.0.1
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
